<style>

.exam{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{background:#11162a;color:#fff;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.side-title{font-size:20px;font-weight:900;margin-bottom:4px}.side-sub{font-size:12px;color:#aeb6ca;margin-bottom:18px}.timer{background:#1c2440;border:1px solid #303957;border-radius:16px;padding:14px;margin-bottom:18px}.timer strong{font-size:27px}.timer small{display:block;color:#aeb6ca;margin-top:3px}.pause{width:100%;margin-top:10px;background:#fff;color:#151b2d;padding:10px;border-radius:10px;font-weight:800}.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 18px}.qdot{height:34px;border-radius:9px;background:var(--red);color:#fff;font-weight:800;position:relative}.qdot.done{background:var(--green)}.qdot.review{background:var(--purple)}.qdot.done.review:after{content:"";position:absolute;inset:-4px;border:2px solid var(--green);border-radius:12px}.qdot.current{outline:3px solid #fff;outline-offset:2px}.legend-key{font-size:11px;color:#b9c0d2;line-height:1.55;margin:10px 0}.submit-side{width:100%;background:#e95b68;color:#fff;padding:12px;border-radius:11px;font-weight:900;margin-top:8px}.main{padding:30px;display:flex;justify-content:center}.question-wrap{width:min(920px,100%);display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.progress{color:var(--muted);font-weight:700}.question-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow);flex:1}.tag{display:inline-block;background:#f0efff;color:var(--accent);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:15px}.question{font-size:25px;line-height:1.45;margin:0 0 26px;letter-spacing:-.02em}.math{font-family:Georgia,serif}.option{display:flex;gap:13px;align-items:flex-start;border:2px solid var(--line);padding:16px;border-radius:15px;margin:11px 0;transition:.18s;background:#fff}.option:hover{border-color:#b9b9f5;background:#fafaff;transform:scale(1.015);box-shadow:0 10px 24px rgba(30,38,70,.08)}.option.selected{border-color:var(--accent);background:#f3f2ff}.option input{accent-color:var(--accent);margin-top:4px}.nav{display:flex;gap:9px;align-items:center;margin-top:18px}.nav button{padding:12px 15px;border-radius:11px;font-weight:800;background:#fff;border:1px solid var(--line);transition:transform .2s ease,box-shadow .2s ease,background .2s ease}.nav button:hover,.round:hover,.pause:hover,.submit-side:hover,.result-actions button:hover,.last-actions button:hover,.qdot:hover{transform:scale(1.05);box-shadow:0 8px 20px rgba(30,38,70,.12)}.nav .next{background:var(--accent);color:#fff;border-color:var(--accent)}.nav .save{margin-left:auto;background:#eef0ff;color:var(--accent);border-color:#dfe1ff}.review-btn{background:#f1e9ff!important;color:#7040b8!important;border-color:#dfcaff!important}.done-review{background:#eaf8f1!important;color:#18784b!important;border-color:#c9eddc!important}.last-actions{display:flex;gap:10px;margin-top:18px}.last-actions button{flex:1}.pause-overlay{position:fixed;inset:0;background:rgba(12,16,30,.7);display:grid;place-items:center;z-index:50}.pause-box{background:#fff;padding:34px;border-radius:24px;text-align:center;width:min(430px,90%);box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(12,16,30,.65);display:grid;place-items:center;z-index:60;padding:20px}.modal-card{background:#fff;border-radius:24px;padding:30px;width:min(450px,100%);box-shadow:var(--shadow)}.modal-card h2{margin-top:0}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.modal-actions button{padding:11px 18px;border-radius:10px;font-weight:800}.cancel{background:#eef0f4}.danger{background:#e05252;color:#fff}
.results{padding:34px;width:min(1100px,100%);margin:auto;animation:resultsEnter .55s cubic-bezier(.2,.8,.2,1) both}.score-card{animation:cardPop .65s .08s cubic-bezier(.2,.8,.2,1) both}.stats .stat{animation:statRise .45s both}.stats .stat:nth-child(1){animation-delay:.18s}.stats .stat:nth-child(2){animation-delay:.28s}.stats .stat:nth-child(3){animation-delay:.38s}.review-card{animation:fadeUp .45s both;animation-delay:calc(min(var(--i, 0) * 20ms, 500ms))}@keyframes resultsEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes cardPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@keyframes statRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.score-card{background:#fff;border-radius:28px;padding:30px;box-shadow:var(--shadow);border:1px solid var(--line);display:grid;grid-template-columns:1fr 260px;gap:28px;align-items:center}.score{font-size:62px;font-weight:950;letter-spacing:-.06em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{padding:17px;background:#f7f8fc;border-radius:15px}.stat b{font-size:24px;display:block}.chart{height:220px;display:flex;align-items:end;justify-content:center;gap:20px;padding:15px}.bar{width:65px;border-radius:10px 10px 3px 3px;position:relative;min-height:5px;background:var(--accent)}.bar.green{background:var(--green)}.bar.red{background:var(--red)}.bar span{position:absolute;bottom:calc(100% + 5px);width:100%;text-align:center;font-weight:900;font-size:12px}.review-list{margin-top:24px;display:grid;gap:14px}.review-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.review-card.correct{border-left:6px solid var(--green)}.review-card.wrong{border-left:6px solid var(--red)}.review-head{display:flex;justify-content:space-between;gap:12px}.pill{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.pill.correct{background:#e7f7ef;color:#167746}.pill.wrong{background:#fdebec;color:#b32e3b}.answer-line{color:var(--muted);margin:7px 0}.solution{background:#f7f8fc;padding:13px;border-radius:12px;line-height:1.6}.result-actions{display:flex;gap:10px;margin:20px 0}.result-actions button{padding:12px 16px;border-radius:11px;font-weight:800;background:#fff;border:1px solid var(--line)}@media(max-width:800px){.exam{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.legend{grid-template-columns:repeat(10,1fr)}.score-card{grid-template-columns:1fr}.question-card{padding:23px}.main{padding:16px}.screen{padding:16px}} 

.name-entry{display:flex;flex-direction:column;align-items:stretch;gap:7px;max-width:420px;margin:20px auto;text-align:left}.name-entry label{font-weight:800;font-size:13px;color:var(--muted)}.name-entry input{font:inherit;padding:13px 15px;border:2px solid var(--line);border-radius:13px;outline:none;transition:.2s}.name-entry input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,91,214,.10)}
.student-name-result{color:var(--muted)}.donut-wrap{display:grid;place-items:center;margin:5px 0 18px}.donut{width:155px;height:155px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0deg,var(--accent) var(--pct),#e9ecf3 var(--pct) 360deg);animation:donutIn 1s cubic-bezier(.2,.8,.2,1) both}.donut:before{content:"";position:absolute;width:118px;height:118px;border-radius:50%;background:#fff}.donut>div{position:relative;z-index:1;text-align:center}.donut strong{display:block;font-size:28px}.donut span{font-size:12px;color:var(--muted)}@keyframes donutIn{from{transform:scale(.65) rotate(-80deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.review-badges{display:flex;gap:8px;align-items:center}.difficulty{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.diff-easy{background:#dff6e9;color:#167746}.diff-medium{background:#fff2bf;color:#7a5b00}.diff-hard{background:#fde0e0;color:#b32632}.diff-advanced{background:#d9f4ff;color:#00749a}.solution details{margin-top:13px;border-top:1px solid var(--line);padding-top:10px}.solution summary{cursor:pointer;font-weight:800;color:var(--accent);user-select:none}.detail-text{margin-top:10px}.solution-graph{margin:10px 0}.solution-graph svg{width:100%;max-width:420px;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.solution-graph .axis{stroke:#9aa3b5;stroke-width:1.5}.solution-graph .curve{fill:none;stroke:var(--accent);stroke-width:4}.solution-graph .point{fill:var(--red)}

<script>
const questions=[
["Solve: x² − 7x + 12 = 0","3, 4",["2, 6","3, 4","−3, −4","1, 12"],"x²−7x+12=(x−3)(x−4), so x=3,4."],
["The roots of 2x² − 5x − 3 = 0 are:","3, −1/2",["3, −1/2","3, 1/2","−3, 1/2","−3, −1/2"],"2x²−5x−3=(2x+1)(x−3)."],
["Without solving, determine the nature of the roots: 3x² − 4x + 5 = 0","No real roots",["Two distinct real roots","Two equal real roots","No real roots","One positive and one negative root"],"D=b²−4ac=16−60=−44<0, so there are no real roots."],
["For what value of k will x² − 6x + k = 0 have equal roots?","9",["3","6","9","12"],"Equal roots require D=0: 36−4k=0, hence k=9."],
["A quadratic equation whose roots have sum 7 and product 10 is:","x²−7x+10=0",["x²+7x+10=0","x²−7x+10=0","x²+7x−10=0","x²−10x+7=0"],"The equation is x²−(sum)x+product=0."],
["If α,β are roots of x²−8x+15=0, then α²+β² is:","34",["34","49","64","79"],"α+β=8 and αβ=15. Thus α²+β²=8²−2(15)=34."],
["If α,β are roots of x²−5x+6=0, then α³+β³ is:","35",["25","30","35","45"],"α+β=5, αβ=6. α³+β³=(α+β)³−3αβ(α+β)=125−90=35."],
["If α,β are roots of x²+5x+2021=0, find (α²+3α+2021)(β²+7β+2021).","−8084",["−4042","−8084","4042","8084"],"For α: α²+5α+2021=0, so the first factor is −2α. For β, the second factor is 2β. Product=−4αβ=−4(2021)=−8084."],
["If α,β are roots of 2x²−7x+3=0, then 1/α+1/β equals:","7/3",["2/7","3/7","7/3","7/2"],"α+β=7/2 and αβ=3/2. Hence (α+β)/(αβ)=7/3."],
["If α,β are roots of x²−4x+1=0, the equation whose roots are α+1,β+1 is:","x²−6x+6=0",["x²−4x+1=0","x²−5x+5=0","x²−6x+6=0","x²−6x+5=0"],"New sum=α+β+2=6; new product=(α+1)(β+1)=1+4+1=6. Equation x²−6x+6=0."],
["The graph of y=x²−5x+6 intersects the x-axis at:","x=2,3",["x=1,6","x=2,3","x=−2,−3","x=0,6"],"Set y=0: x²−5x+6=(x−2)(x−3)=0."],
["The graph of y=x²+4x+5 has:","No x-intercepts",["Two x-intercepts","One x-intercept","No x-intercepts","Three x-intercepts"],"D=16−20=−4<0, so there are no real roots and no x-intercepts."],
["A parabola intersects the x-axis at exactly two distinct points. Which statement must be true?","Its discriminant is positive",["Its discriminant is zero","Its discriminant is positive","Its discriminant is negative","Its two roots are equal"],"Two distinct x-intercepts mean two distinct real roots, so D>0."],
["A parabola touches the x-axis at exactly one point. Which statement is true?","It has two equal real roots",["It has two distinct real roots","It has two equal real roots","It has no real roots","Its roots must have opposite signs"],"One point of contact means a repeated real root, so D=0."],
["The product of two consecutive positive integers is 156. The integers are:","12, 13",["10, 16","11, 15","12, 13","13, 14"],"Let them be x,x+1. x²+x−156=0=(x−12)(x+13), so the positive pair is 12,13."],
["The product of two consecutive positive odd integers is 143. They are:","11, 13",["9, 11","11, 13","13, 15","7, 9"],"Let them be x,x+2. x²+2x−143=0=(x−11)(x+13), so 11,13."],
["A rectangular garden has area 180 m². Its length is 3 m greater than its breadth. Its dimensions are:","12 m × 15 m",["9 m × 20 m","10 m × 18 m","12 m × 15 m","6 m × 30 m"],"Let breadth=x. x(x+3)=180, giving x=12 and length=15."],
["A car travels 240 km. If its speed is increased by 10 km/h, the journey takes one hour less. Its original speed is:","40 km/h",["30 km/h","35 km/h","40 km/h","50 km/h"],"240/x−240/(x+10)=1 gives x²+10x−2400=0, so x=40."],
["A train travels a distance of 300 km at a certain speed. If its speed were increased by 5 km/h, the journey would take 1 hour less. What is its original speed?","35 km/h",["25 km/h","30 km/h","35 km/h","40 km/h"],"300/x−300/(x+5)=1 gives x²+5x−1500=0=(x−35)(x+40). Positive speed=35."],
["A can complete a job in x days, while B takes 5 days more. Together they complete the job in 6 days. A alone takes:","10 days",["8 days","10 days","12 days","15 days"],"1/x+1/(x+5)=1/6 gives x²−7x−30=0, so x=10."],
["The hypotenuse of a right triangle is 13 cm. One leg is 7 cm longer than the other. The legs are:","5 cm and 12 cm",["4 cm and 11 cm","5 cm and 12 cm","6 cm and 13 cm","7 cm and 14 cm"],"x²+(x+7)²=169 gives x²+7x−60=0, so x=5 and x+7=12."],
["A rectangular sheet has area 192 cm². Its length is 4 cm greater than its breadth. Its dimensions are:","12 cm × 16 cm",["8 cm × 24 cm","10 cm × 19.2 cm","12 cm × 16 cm","14 cm × 18 cm"],"x(x+4)=192 gives x²+4x−192=0, so breadth=12 and length=16."],
["If x=cosθ, where 0°<θ<90°, and 2x²−x=0, then θ is:","60°",["30°","45°","60°","90°"],"x(2x−1)=0. Since 0<cosθ<1, cosθ=1/2, so θ=60°."],
["If x=cos²θ and 4x²−5x+1=0, where 0°<θ<90°, then θ is:","60°",["30°","45°","60°","75°"],"Factor: (4x−1)(x−1)=0. Acute θ excludes x=1, so cos²θ=1/4 and θ=60°."],
["A car travels a distance of 360 km at a certain speed. If its speed were 5 km/h more, it would take 1 hour less. The original speed was:","40 km/h",["35 km/h","40 km/h","45 km/h","50 km/h"],"360/x−360/(x+5)=1 gives x²+5x−1800=0, so x=40."],
["Find <math display=\"inline\"><mrow><mn>2</mn><mo>+</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mo>+</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mo>+</mo><mo>⋯</mo><mo>∞</mo></mrow></mfrac></mrow></mfrac></mrow></math>","1+√2",["1+√2","2+√2","1−√2","2−√2"],"Let the repeating value be y. Then y=2+1/y, so y²−2y−1=0. The positive value greater than 2 is 1+√2."],
["A can complete a piece of work in x days, while B takes 6 days more than A. Working together, they complete the work in 4 days. x is:","6",["4","6","8","10"],"1/x+1/(x+6)=1/4 gives x²−2x−24=0, so x=6."],
["A can complete a work 8 days faster than B. Working together, they complete the work in 12 days. The number of days taken by A alone is:","24 days",["16 days","20 days","24 days","30 days"],"Let A take x days, B x+8. 1/x+1/(x+8)=1/12 gives x²−16x−96=0, so x=24."],
["A and B together can complete a work in 6 days. A alone takes 5 days more than B alone. The time taken by B alone is:","10 days",["8 days","10 days","12 days","15 days"],"Let B take x days, A x+5. 1/x+1/(x+5)=1/6 gives x²−7x−30=0, so x=10."],
["For what values of k does x²+(k+2)x+9=0 have equal roots?","k=4 or −8",["k=4 only","k=−8 only","k=4 or −8","k=2 or −4"],"Equal roots require D=0: (k+2)²−36=0, so k+2=±6 and k=4 or −8."]
];

let state={screen:"welcome",name:"",time:60*60,remaining:60*60,started:false,paused:false,current:0,answers:Array(30).fill(null),status:Array(30).fill("unattempted"),spent:Array(30).fill(0),lastTick:Date.now(),submitted:false};
const KEY="quadraticQuestStateV1";
function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function loadState(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.screen==="exam"&&!s.submitted){state=s;state.paused=true;state.lastTick=Date.now();return true}}catch(e){}return false}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const difficulty=["easy","easy","easy","easy","easy","easy","medium","advanced","medium","medium","medium","medium","medium","medium","medium","medium","medium","medium","medium","medium","hard","hard","medium","medium","medium","advanced","medium","medium","medium","medium"];
const difficultyLabel={easy:"Easy",medium:"Medium",hard:"Hard",advanced:"Advanced"};
const difficultyClass={easy:"diff-easy",medium:"diff-medium",hard:"diff-hard",advanced:"diff-advanced"};

function render(){
 const app=document.getElementById("app");
 if(state.screen==="welcome")app.innerHTML=`<section class="screen welcome"><div class="welcome-card"><div class="logo">Quadratic<span>Quest</span></div><h1>Welcome, explorer.</h1><p>A calm, focused Class 10 quadratic-equations challenge. Choose your own time, work at your pace, and use review tools whenever you need them.</p><p><b>30 MCQs</b> · Algebra · Graphs · Geometry · Speed & Distance · Work & Time · HOTS</p><div class="name-entry"><label for="studentName">Your name</label><input id="studentName" maxlength="50" placeholder="Enter your name" value="${esc(state.name||"")}" oninput="state.name=this.value"></div><button class="primary" onclick="showSetup()">Set my time →</button></div></section>`;
 else if(state.screen==="setup")renderSetup(app);
 else if(state.screen==="exam")renderExam(app);
 else if(state.screen==="results")renderResults(app);
}
function showSetup(){state.screen="setup";render()}
function renderSetup(app){
 let mins=Math.round(state.time/60);
 app.innerHTML=`<section class="screen setup"><div class="setup-card"><div class="logo">Quadratic<span>Quest</span></div><h2>How much time do you need?</h2><p class="time-hint">Spin the clock with − / +. Maximum time: <b>90 minutes</b>.</p><div class="clock"><div class="clock-inner"><div class="clock-value">${mins}</div><div class="clock-label">minutes</div></div></div><div class="time-controls"><button class="round" onclick="changeTime(-5)">−</button><b>Adjust in 5-minute steps</b><button class="round" onclick="changeTime(5)">+</button></div><p class="time-hint">Warnings appear at 20, 10 and 5 minutes remaining. You can pause at any time.</p><button class="primary" onclick="startTest()">Lock in ${mins} minutes →</button></div></section>`;
}
function changeTime(d){state.time=Math.min(90*60,Math.max(5*60,state.time+d*60));state.remaining=state.time;render()}
function startTest(){
 state.screen="exam";
 state.started=true;
 state.paused=false;
 state.remaining=state.time;
 state.deadline=Date.now()+state.time*1000;
 state.lastTick=Date.now();
 state.warned=[];
 state._lastPersist=0;
 saveState();
 render();
 startTicker();
}
function startTicker(){
 clearInterval(window.tick);
 state.lastTick=Date.now();
 if(!state.deadline) state.deadline=Date.now()+Math.max(0,state.remaining*1000);

 window.tick=setInterval(()=>{
   if(state.screen!=="exam"){clearInterval(window.tick);return}
   if(state.paused){
     state.lastTick=Date.now();
     return;
   }

   const now=Date.now();
   const previousRemaining=state.remaining;
   const newRemaining=Math.max(0,(state.deadline-now)/1000);
   const elapsed=Math.max(0,(previousRemaining-newRemaining));

   state.spent[state.current]+=elapsed;
   state.remaining=newRemaining;
   state.lastTick=now;

   // Reminders fire once when the deadline crosses each threshold.
   [1200,600,300].forEach(threshold=>{
     if(previousRemaining>threshold && newRemaining<=threshold && !state.warned?.includes(threshold)){
       state.warned=state.warned||[];
       state.warned.push(threshold);
       notify("Time reminder",`${threshold/60} minutes remaining.`);
     }
   });

   updateExamBits();

   if(newRemaining<=0){
     state.remaining=0;
     saveState();
     clearInterval(window.tick);
     submit(true);
     return;
   }

   // Persist periodically rather than on every repaint.
   if(!state._lastPersist || now-state._lastPersist>3000){
     state._lastPersist=now;
     saveState();
   }
 },100);
}

function notify(title,msg){let n=document.createElement("div");n.style="position:fixed;right:20px;top:20px;z-index:100;background:#fff;border:1px solid #e5e8ef;border-radius:16px;padding:16px 18px;box-shadow:0 15px 40px rgba(0,0,0,.15);max-width:320px";n.innerHTML=`<b>${esc(title)}</b><div style="color:#6c7486;margin-top:4px">${esc(msg)}</div>`;document.body.appendChild(n);setTimeout(()=>n.remove(),4500)}
function updateExamBits(){
 let t=document.getElementById("timerText");
 if(t)t.textContent=format(state.remaining);
 let p=document.getElementById("progressText");
 if(p)p.textContent=`Question ${state.current+1} of 30`;
}
function format(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function renderExam(app){
 const q=questions[state.current], selected=state.answers[state.current];
 let dots=questions.map((_,i)=>`<button class="qdot ${state.status[i]==="done"?"done":""} ${state.status[i]==="review"?"review":""} ${state.status[i]==="done-review"?"done review":""} ${i===state.current?"current":""}" onclick="goQ(${i})">${i+1}</button>`).join("");
 let opts=q[2].map((o,i)=>`<label class="option ${selected===i?"selected":""}"><input type="radio" name="opt" ${selected===i?"checked":""} onchange="choose(${i})"><span><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</span></label>`).join("");
 let last=state.current===29;
 app.innerHTML=`<div class="exam"><aside class="sidebar"><div class="side-title">QuadraticQuest</div><div class="side-sub">Class 10 • 30 questions</div><div class="timer"><small>TIME REMAINING</small><strong id="timerText">${format(state.remaining)}</strong><button class="pause" onclick="togglePause()">⏸ ${state.paused?"Resume":"Pause"} test</button></div><div style="font-weight:900;margin-bottom:8px">Question map</div><div class="legend">${dots}</div><div class="legend-key">🔴 Not attempted<br>🟢 Done<br>🟣 Review later<br>🟣 + green ring = done, review later</div><button class="submit-side" onclick="confirmSubmit()">Submit test</button></aside><main class="main"><div class="question-wrap"><div class="topbar"><span class="progress" id="progressText">Question ${state.current+1} of 30</span><span style="color:#6c7486">HOTS ★ when marked</span></div><div class="question-card"><span class="tag">Question ${state.current+1}</span><h2 class="question">${q[0]}</h2>${opts}<div class="nav"><button onclick="previous()">← Previous</button><button class="review-btn" onclick="markReview()">Mark as review later</button><button class="done-review" onclick="markDoneReview()">Mark as done but review later</button><button class="next" onclick="next()">Next →</button><button class="save" onclick="manualSave()">Save</button></div>${last?`<div class="last-actions"><button class="primary" onclick="confirmSubmit()">Save and submit</button><button onclick="manualSave()">Simply save</button></div>`:""}</div></div></main></div>${state.paused?`<div class="pause-overlay"><div class="pause-box"><h2>Test paused</h2><p>Your progress and timing are saved. Take your interruption, then come back when you're ready.</p><button class="primary" onclick="togglePause()">Resume test</button><button onclick="restartTest()" style="margin-top:10px;padding:11px 16px;border-radius:10px;background:#fff;border:1px solid #e4e8f0;font-weight:800">Restart & choose time</button></div></div>`:""}`;
}
function choose(i){state.answers[state.current]=i;saveState();renderExam(document.getElementById("app"))}
function goQ(i){state.current=i;state.lastTick=Date.now();saveState();render()}
function previous(){if(state.current>0){state.current--;state.lastTick=Date.now();saveState();render()}}
function next(){if(state.answers[state.current]!==null)state.status[state.current]=state.status[state.current]==="review"?"done-review":"done";if(state.current<29)state.current++;state.lastTick=Date.now();saveState();render()}
function markReview(){state.status[state.current]=state.answers[state.current]!==null?"done-review":"review";saveState();notify("Saved for review","This question is marked purple in the map.");render()}
function markDoneReview(){if(state.answers[state.current]===null){notify("Choose an answer first","Select an option before marking it done.");return}state.status[state.current]="done-review";saveState();render()}
function manualSave(){
 if(state.screen==="exam"&&!state.paused&&state.deadline){
   state.remaining=Math.max(0,(state.deadline-Date.now())/1000);
   state.lastTick=Date.now();
 }
 saveState();
 notify("Progress saved","Your answers, review flags and timing are safely stored on this device.");
}
function togglePause(){
 const now=Date.now();

 if(!state.paused){
   // Freeze the exact remaining time.
   state.remaining=Math.max(0,(state.deadline-now)/1000);
   state.paused=true;
 }else{
   // Resume from the frozen remaining time.
   state.deadline=now+Math.max(0,state.remaining*1000);
   state.lastTick=now;
   state.paused=false;
 }

 saveState();
 render();
 if(!state.paused) startTicker();
}
function confirmSubmit(){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="confirm"><div class="modal-card"><h2>Are you sure you want to submit your test?</h2><p>You won't be able to change your answers after submission.</p><div class="modal-actions"><button class="cancel" onclick="document.getElementById('confirm').remove()">No</button><button class="danger" onclick="document.getElementById('confirm').remove();submit(false)">Yes, submit</button></div></div></div>`)}
function submit(auto){clearInterval(window.tick);state.submitted=true;state.screen="results";state.paused=false;state.submitReason=auto?"Time expired":"Manual submission";saveState();render()}
function renderResults(app){
 let correct=0;questions.forEach((q,i)=>{const isQ5=i===4; const expected=isQ5?1:q[2].findIndex(opt=>opt===q[1]); if(state.answers[i]!==null&&state.answers[i]===expected)correct++});
 let wrong=questions.length-correct-(state.answers.filter(x=>x===null).length);
 let unanswered=state.answers.filter(x=>x===null).length;
 let pct=Math.round(correct/30*100), avg=Math.round(state.spent.reduce((a,b)=>a+b,0)/30); let donutDeg=Math.round(pct*3.6);
 let cards=questions.map((q,i)=>{let a=state.answers[i],expected=i===4?1:q[2].findIndex(opt=>opt===q[1]),isCorrect=a!==null&&a===expected, user=a===null?"Not attempted":q[2][a],d=difficulty[i];return `<article class="review-card ${isCorrect?"correct":"wrong"}" style="--i:${i}"><div class="review-head"><b>Q${i+1}. ${esc(q[0])}</b><div class="review-badges"><span class="difficulty ${difficultyClass[d]}">${difficultyLabel[d]}</span><span class="pill ${isCorrect?"correct":"wrong"}">${a===null?"Unanswered":isCorrect?"Correct":"Wrong"}</span></div></div><div class="answer-line">Your answer: <b>${esc(user)}</b> · Correct answer: <b>${esc(q[1])}</b> · Time: <b>${format(state.spent[i])}</b></div><div class="solution"><b>Solution:</b> ${esc(q[3])}</div></article>`}).join("");
 app.innerHTML=`<section class="results"><div class="logo">Quadratic<span>Quest</span></div><p style="color:#6c7486">${state.submitReason||"Test submitted"} • Your answers are saved on this device.</p><div class="score-card"><div><div class="score">${correct}/30</div><h2>${pct}% score</h2><p class="student-name-result">Student: <b>${esc(state.name||"Student")}</b></p><p style="color:#6c7486">Nice work. Review the detailed breakdown below to understand every question.</p><div class="stats"><div class="stat"><b>${correct}</b>Correct</div><div class="stat"><b>${wrong}</b>Wrong</div><div class="stat"><b>${unanswered}</b>Unanswered</div></div></div><div><h3 style="text-align:center">Performance</h3><div class="donut-wrap"><div class="donut" style="--pct:${donutDeg}deg"><div><strong>${pct}%</strong><span>score</span></div></div></div><h3 style="text-align:center">Answer breakdown</h3><div class="chart"><div class="bar green" style="height:${Math.max(5,correct/30*180)}px"><span>${correct}</span></div><div class="bar red" style="height:${Math.max(5,wrong/30*180)}px"><span>${wrong}</span></div><div class="bar" style="height:${Math.max(5,unanswered/30*180)}px"><span>${unanswered}</span></div></div><div style="display:flex;justify-content:space-around;font-size:12px;color:#6c7486"><span>Correct</span><span>Wrong</span><span>Blank</span></div></div></div><div class="result-actions"><button onclick="document.getElementById('reviewList').scrollIntoView({behavior:'smooth'})">View all answers & solutions ↓</button><button onclick="downloadResult()">Export student result</button><button onclick="restartTest()">Restart test & choose time</button></div><h2 id="reviewList">Question-by-question review</h2><div class="review-list">${cards}</div></section>`;
}

function downloadResult(){
  const correct=questions.reduce((n,q,i)=>n+(state.answers[i]!==null&&state.answers[i]===(i===4?1:q[2].findIndex(o=>o===q[1]))?1:0),0);
  const result={student:state.name||"Student",score:`${correct}/30`,percentage:Math.round(correct/30*100),submittedAt:new Date().toISOString(),answers:questions.map((q,i)=>({question:i+1,answer:state.answers[i]===null?null:q[2][state.answers[i]],correctAnswer:q[1],difficulty:difficultyLabel[difficulty[i]],timeSeconds:Math.round(state.spent[i])}))};
  const blob=new Blob([JSON.stringify(result,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`QuadraticQuest_${(state.name||"student").replace(/[^a-z0-9_-]/gi,"_")}_result.json`;a.click();URL.revokeObjectURL(url);
}

function restartTest(){
 clearInterval(window.tick);
 localStorage.removeItem(KEY);
 state={
   screen:"setup",
   time:60*60,
   remaining:60*60,
   started:false,
   paused:false,
   current:0,
   answers:Array(30).fill(null),
   status:Array(30).fill("unattempted"),
   spent:Array(30).fill(0),
   lastTick:Date.now(),
   deadline:null,
   warned:[],
   submitted:false
 };
 render();
}
window.addEventListener("beforeunload",()=>{
 if(state.screen==="exam"&&!state.submitted){
   const now=Date.now();
   if(!state.paused&&state.deadline) state.remaining=Math.max(0,(state.deadline-now)/1000);
   state.paused=true;
   state.lastTick=now;
   state.deadline=null;
   saveState();
 }
});
if(loadState()){state.deadline=null;render();notify("Test restored","The test was automatically paused and your progress was recovered.")}else render();
</script>
</body>
</html>
